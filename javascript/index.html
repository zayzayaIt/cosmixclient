<!DOCTYPE html>
<html lang="und" style="width:100%;height:100%;background-color:black;">
	<head>
		<script type="text/javascript">
			// Redirect root index to the in-page game HTML so the game appears first
			if(location.pathname.indexOf('Eaglercraft_1.12_Offline_en_US.html') === -1) {
				location.replace('Eaglercraft_1.12_Offline_en_US.html');
			}
		</script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
		<meta name="description" content="Eaglercraft 1.12 test directory HTML page">
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.12, 1.12.2">
		<title>Eaglercraft 1.12.2</title>
		<meta property="og:locale" content="en-US">
		<meta property="og:type" content="website">
		<meta property="og:title" content="Eaglercraft 1.12.2">
		<meta property="og:description" content="test directory HTML page">
		<link type="image/png" rel="shortcut icon" href="favicon.png">
		<script type="text/javascript" src="classes.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: "worlds",
						logInvalidCerts: true,
						crashOnUncaughtExceptions: true
					};
					// Normalize absolute-root asset paths so site works under a project subpath (GitHub Pages)
					(function(){
						var basePrefix = '';
						var projectSubpath = '/cosmixclient';
						if(location.pathname.indexOf(projectSubpath + '/') === 0 || location.pathname === projectSubpath || location.pathname === projectSubpath + '/'){
							basePrefix = projectSubpath;
						}
						function normalizePath(p){
							if(typeof p === 'string' && p.length && p.charAt(0) === '/') return basePrefix + p;
							return p;
						}
						// Patch common EagRuntime resource helpers if present
						if(window.EagRuntime){
							['getResourceString','getRequiredResourceString','getResourceBytes','getRequiredResourceBytes','getResourceStream'].forEach(function(fn){
								if(typeof window.EagRuntime[fn] === 'function'){
									var orig = window.EagRuntime[fn];
									window.EagRuntime[fn] = function(p){ if(p && p.charAt && p.charAt(0) === '/') p = normalizePath(p); return orig.call(this,p); };
								}
							});
						}
						// Rewrite outgoing network requests that use absolute-root paths
						if(window.fetch){
							var _fetch = window.fetch.bind(window);
							window.fetch = function(input, init){
								try{
									if(typeof input === 'string') input = normalizePath(input);
									else if(input && input.url && typeof input.url === 'string') input = new Request(normalizePath(input.url), input);
								}catch(e){}
								return _fetch(input, init);
							};
						}
						if(window.XMLHttpRequest){
							var _open = XMLHttpRequest.prototype.open;
							XMLHttpRequest.prototype.open = function(method, url){
								try{ url = normalizePath(url); }catch(e){}
								return _open.apply(this, arguments);
							};
						}
					})();
					main();
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
	</body>
</html>
