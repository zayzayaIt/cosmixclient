name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip build — using prebuilt `javascript/`
        run: |
          echo "Skipping Java build; publishing existing javascript/ directory"

      - name: Prepare Pages publish directory
        run: |
          mkdir -p .pages-publish
          cp -R javascript/. .pages-publish/
          cp index.html .pages-publish/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
